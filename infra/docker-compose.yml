services:
  api:
    build:
      context: ../apps/api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - VOICE_WORKER_WS_URL=ws://voice-worker:8001/media
    depends_on:
      - voice-worker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  voice-worker:
    build:
      context: ../apps/voice-worker
    ports:
      - "8001:8001"
    env_file:
      - ../.env
    environment:
      - API_BASE_URL=http://api:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
